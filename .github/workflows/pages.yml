# Publication de l'application statique (dossier web/) sur GitHub Pages : https://victoirendala.github.io/Lunar_Holocron/
# Aucune étape de compilation : le dossier web/ est publié tel quel. À activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
