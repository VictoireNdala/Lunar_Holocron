<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunar Holocron</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/shell.css">
  <!-- Aucune ressource externe : three.js, polices et icônes sont copiés localement (versions figées, voir SOURCES.md). -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
  <script type="module" src="./js/main.js"></script>
  <script>
    // Filet de sécurité (jamais de page blanche) : si main.js ne démarre pas (module en cache périmé, erreur de chargement),
    // message statique bilingue, hors i18n puisque i18n.js peut justement être en cause.
    setTimeout(function () {
      if (document.documentElement.dataset.booted) return;
      var box = document.getElementById('error');
      var text = document.getElementById('error-text');
      if (!box || !text) return;
      text.textContent = "L'application n'a pas démarré (fichiers en cache périmés ou erreur de chargement). Rechargez sans cache : Ctrl+Maj+R. / The app did not start (stale cached files or a load error). Hard-reload: Ctrl+Shift+R.";
      box.hidden = false;
    }, 4000);
  </script>
</head>
<body class="app">
  <!-- Tous les textes sont injectés par js/i18n.js (attributs data-i18n). -->
  <a class="skip-link" href="#main" data-i18n="nav.skip"></a>

  <nav id="rail" class="rail glass" data-i18n-aria="nav.label">
    <button type="button" id="rail-toggle" class="rail-toggle" aria-expanded="false" aria-controls="rail-list">
      <svg class="ico" aria-hidden="true"><use href="./vendor/icons/sprite.svg#i-panel-left-open"></use></svg>
      <span class="rail-label" data-i18n="nav.collapse"></span>
    </button>
    <ul id="rail-list" class="rail-list">
      <li><a class="rail-item" data-view="atlas" href="#view=atlas"><svg class="ico" aria-hidden="true"><use href="./vendor/icons/sprite.svg#i-globe"></use></svg><span class="rail-label" data-i18n="nav.atlas"></span></a></li>
      <li><a class="rail-item" data-view="world" href="#view=world"><svg class="ico" aria-hidden="true"><use href="./vendor/icons/sprite.svg#i-map"></use></svg><span class="rail-label" data-i18n="nav.world"></span></a></li>
      <li><a class="rail-item" data-view="south" href="#view=south"><svg class="ico" aria-hidden="true"><use href="./vendor/icons/sprite.svg#i-compass"></use></svg><span class="rail-label" data-i18n="nav.south"></span></a></li>
      <li><a class="rail-item" data-view="north" href="#view=north"><svg class="ico" aria-hidden="true"><use href="./vendor/icons/sprite.svg#i-compass"></use></svg><span class="rail-label" data-i18n="nav.north"></span></a></li>
      <li><a class="rail-item" data-view="site" href="#view=site"><svg class="ico" aria-hidden="true"><use href="./vendor/icons/sprite.svg#i-mountain"></use></svg><span class="rail-label" data-i18n="nav.site"></span></a></li>
      <li><a class="rail-item" data-view="method" href="#view=method"><svg class="ico" aria-hidden="true"><use href="./vendor/icons/sprite.svg#i-book-open"></use></svg><span class="rail-label" data-i18n="nav.method"></span></a></li>
    </ul>
  </nav>

  <div class="stage">
    <!-- Scène plein écran de la vue de site (relief 3D). -->
    <div id="scene" class="scene" data-scene="site">
      <div id="view3d" class="view3d"></div>
    </div>
    <!-- Scène de l'Atlas : globe 3D (sphère lisse texturée, D-015). -->
    <div id="atlas-scene" class="scene" data-scene="atlas" hidden>
      <div id="globe" class="view3d"></div>
      <div id="globe-tip" class="globe-tip" role="tooltip" hidden></div>
    </div>
    <div class="scene scene-map" data-scene="world" hidden>
      <canvas class="map-canvas" role="img" data-i18n-aria="map.aria.world"></canvas>
      <div class="globe-tip" role="tooltip" hidden></div>
    </div>
    <div class="scene scene-map" data-scene="south" hidden>
      <canvas class="map-canvas" role="img" data-i18n-aria="map.aria.south"></canvas>
      <div class="globe-tip" role="tooltip" hidden></div>
    </div>
    <div class="scene scene-map" data-scene="north" hidden>
      <canvas class="map-canvas" role="img" data-i18n-aria="map.aria.north"></canvas>
      <div class="globe-tip" role="tooltip" hidden></div>
    </div>

    <header class="topbar glass glass-blur">
      <div class="brand">
        <span class="brand-name" data-i18n="app.title"></span>
        <span class="crumb-sep" aria-hidden="true">·</span>
        <span id="crumb" class="crumb"></span>
      </div>
      <div class="controls">
        <label class="field inline">
          <span class="visually-hidden" data-i18n="site.label"></span>
          <select id="site-select"></select>
        </label>
        <button type="button" id="scene-only" class="btn scene-btn" aria-pressed="false"><svg class="ico" aria-hidden="true"><use href="./vendor/icons/sprite.svg#i-eye-off"></use></svg><span class="scene-label"></span></button>
        <div class="lang" role="group" data-i18n-aria="lang.label">
          <button type="button" class="lang-btn" data-lang="fr" aria-pressed="true">FR</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <!-- Pastille d'honnêteté (UI-DESIGN § 5.5) : toujours visible ; seule la note explicative se replie. -->
    <div class="honesty">
      <button type="button" id="honesty-chip" class="chip" aria-expanded="false" aria-controls="honesty-note">
        <span class="chip-dot" aria-hidden="true"></span><span id="honesty-label"></span><span class="chip-caret" aria-hidden="true">▾</span>
      </button>
      <p id="honesty-note" class="chip-note glass" hidden></p>
    </div>

    <div id="tray" class="tray" role="toolbar" data-i18n-aria="panel.tray" hidden></div>

    <div id="error" class="error" role="alert" hidden>
      <strong data-i18n="error.title"></strong>
      <p id="error-text"></p>
    </div>
    <p id="loading" class="loading" data-i18n="loading"></p>

    <main id="main" tabindex="-1">
      <!-- Vue de site : tiroir à droite et barre de temps en bas, par-dessus la scène. -->
      <div id="panel-a" data-view-panel="site" data-needs-site hidden>
        <aside class="drawer" data-i18n-aria="site.heading">
          <section class="card glass verdict" aria-labelledby="verdict-heading" data-panel="verdict" data-panel-view="site" data-panel-title="verdict.heading">
            <h2 id="verdict-heading" data-i18n="verdict.heading"></h2>
            <div class="seg" role="group" data-i18n-aria="verdict.threshold">
              <button type="button" class="btn thr-btn" data-threshold="strict" aria-pressed="true" data-i18n="verdict.strict"></button>
              <button type="button" class="btn thr-btn" data-threshold="any" aria-pressed="false" data-i18n="verdict.any"></button>
            </div>
            <p id="threshold-note" class="hint"></p>
            <div class="big-row">
              <p class="big big-sun"><span class="big-num num" id="big-sun"></span><span class="big-label"><span class="icon icon-sun" aria-hidden="true"></span><span data-i18n="verdict.sunBig"></span></span></p>
              <p class="big big-earth"><span class="big-num num" id="big-earth"></span><span class="big-label"><span class="icon icon-earth" aria-hidden="true"></span><span data-i18n="verdict.earthBig"></span></span></p>
            </div>
            <p id="verdict-window" class="hint"></p>
            <p id="verdict-position" class="hint"></p>
            <dl class="kpis">
              <div class="kpi" data-tip="verdict.tip.both"><dt data-i18n="verdict.kpi.both"></dt><dd id="kpi-both" class="num"></dd></div>
              <div class="kpi" data-tip="verdict.tip.sunGap"><dt data-i18n="verdict.kpi.sunGap"></dt><dd id="kpi-sun-gap" class="num"></dd></div>
              <div class="kpi" data-tip="verdict.tip.earthGap"><dt data-i18n="verdict.kpi.earthGap"></dt><dd id="kpi-earth-gap" class="num"></dd></div>
            </dl>
            <p class="hint" data-i18n="verdict.kpiNote"></p>
            <h3 data-i18n="verdict.monthly"></h3>
            <div id="heat" class="heat"></div>
            <p class="hint" data-i18n="verdict.monthlyNote"></p>
            <button type="button" class="btn" id="verdict-table-toggle" aria-expanded="false" aria-controls="verdict-table"></button>
            <div id="verdict-table" class="table-scroll" hidden>
              <table class="readings">
                <thead><tr><th scope="col" data-i18n="verdict.col.month"></th><th scope="col" data-i18n="body.sun"></th><th scope="col" data-i18n="body.earth"></th><th scope="col" data-i18n="verdict.kpi.both"></th></tr></thead>
                <tbody id="verdict-table-body"></tbody>
              </table>
            </div>
          </section>

          <section class="card glass" aria-labelledby="view3d-heading" data-panel="view3d" data-panel-view="site" data-panel-title="view3d.heading">
            <h2 id="view3d-heading" data-i18n="view3d.heading"></h2>
            <div class="toolbar">
              <div class="seg" role="group" data-i18n-aria="view3d.mode">
                <button type="button" class="btn mode-btn" data-mode="overview" aria-pressed="true" data-i18n="view3d.overview"></button>
                <button type="button" class="btn mode-btn" data-mode="ground" aria-pressed="false" data-i18n="view3d.ground"></button>
              </div>
              <div id="view3d-turn" class="seg" hidden>
                <button type="button" class="btn" data-turn="-1" data-i18n="view3d.turnLeft"></button>
                <span id="view3d-az" class="az"></span>
                <button type="button" class="btn" data-turn="1" data-i18n="view3d.turnRight"></button>
              </div>
              <label class="field inline">
                <span data-i18n="view3d.exaggeration"></span>
                <input id="view3d-exag" type="range" min="1" max="5" step="0.5" value="1">
                <output id="view3d-exag-value" for="view3d-exag"></output>
              </label>
            </div>
            <label class="check"><input id="view3d-study" type="checkbox" checked><span data-i18n="view3d.study"></span></label>
            <div class="legend">
              <span data-i18n="view3d.legend"></span>
              <div id="legend-bar" class="legend-bar" aria-hidden="true"></div>
              <div class="legend-scale"><span id="legend-min"></span><span id="legend-max"></span></div>
            </div>
            <p id="view3d-status" class="warning" role="status" hidden></p>
            <p class="hint" data-i18n="view3d.note"></p>
          </section>

          <section class="card glass" aria-labelledby="bodies-heading" data-panel="bodies" data-panel-view="site" data-panel-title="bodies.heading">
            <h2 id="bodies-heading" data-i18n="bodies.heading"></h2>
            <p id="direct-link" class="direct-link" role="status"></p>
            <div id="reading-warnings" class="warning" role="status" hidden></div>
            <article class="reading" data-reading="sun">
              <h3><span class="icon icon-sun" aria-hidden="true"></span><span data-i18n="body.sun"></span> <span class="status" data-field="status"></span></h3>
              <p class="hint" data-field="binary"></p>
              <dl class="facts">
                <dt data-i18n="reading.az"></dt><dd class="num" data-field="az"></dd>
                <dt data-i18n="reading.el"></dt><dd class="num" data-field="el"></dd>
                <dt data-i18n="reading.horizon"></dt><dd class="num" data-field="horizon"></dd>
                <dt data-i18n="reading.margin"></dt><dd class="num" data-field="margin"></dd>
                <dt data-i18n="reading.radius"></dt><dd class="num" data-field="radius"></dd>
              </dl>
            </article>
            <article class="reading" data-reading="earth">
              <h3><span class="icon icon-earth" aria-hidden="true"></span><span data-i18n="body.earth"></span> <span class="status" data-field="status"></span></h3>
              <p class="hint" data-field="binary"></p>
              <dl class="facts">
                <dt data-i18n="reading.az"></dt><dd class="num" data-field="az"></dd>
                <dt data-i18n="reading.el"></dt><dd class="num" data-field="el"></dd>
                <dt data-i18n="reading.horizon"></dt><dd class="num" data-field="horizon"></dd>
                <dt data-i18n="reading.margin"></dt><dd class="num" data-field="margin"></dd>
                <dt data-i18n="reading.radius"></dt><dd class="num" data-field="radius"></dd>
              </dl>
            </article>
            <p class="hint" data-i18n="bodies.note"></p>
          </section>

          <section class="card glass" aria-labelledby="site-heading" data-panel="site" data-panel-view="site" data-panel-title="site.heading">
            <h2 id="site-heading" data-i18n="site.heading"></h2>
            <p id="site-name" class="site-name"></p>
            <p id="site-synthetic" class="tag" data-i18n="site.synthetic" hidden></p>
            <dl id="site-info" class="facts"></dl>
            <h3 data-i18n="prov.heading"></h3>
            <dl id="site-provenance" class="facts"></dl>
            <div id="links-block" hidden>
              <h3 data-i18n="links.heading"></h3>
              <p id="links-coords" class="num"></p>
              <p id="links-source" class="hint"></p>
              <p id="links-invalid" class="warning" role="status" data-i18n="links.invalid" hidden></p>
              <div id="links-actions" class="toolbar">
                <a id="link-quickmap" class="btn" target="_blank" rel="noopener noreferrer" data-i18n="links.quickmap"></a>
                <a id="link-trek" class="btn" target="_blank" rel="noopener noreferrer" data-i18n="links.trek"></a>
                <button type="button" class="btn" id="links-copy" data-i18n="links.copy"></button>
              </div>
              <p id="links-status" class="hint" role="status" hidden></p>
              <p id="links-note" class="hint"></p>
              <p class="hint" data-i18n="links.credit"></p>
            </div>
          </section>
        </aside>

      </div>

      <!-- Panorama (vue de site) et barre de temps : commune à la vue de site et à l'Atlas (une seule horloge, ATLAS § 4). -->
        <div class="dock" data-view-panel="site atlas world south north" data-needs-site hidden>
        <section class="panorama glass" aria-labelledby="pano-heading" data-panel="panorama" data-panel-view="site" data-view-only="site" data-panel-title="pano.heading">
          <div class="pano-head">
            <h2 id="pano-heading" data-i18n="pano.heading"></h2>
            <div class="seg" role="group" data-i18n-aria="pano.controls">
              <button type="button" class="btn" id="pano-left" data-i18n-aria="pano.left">◀</button>
              <button type="button" class="btn" id="pano-right" data-i18n-aria="pano.right">▶</button>
            </div>
            <div class="seg" role="group" data-i18n-aria="pano.center">
              <button type="button" class="btn" id="pano-sun"><span class="icon icon-sun" aria-hidden="true"></span><span data-i18n="body.sun"></span></button>
              <button type="button" class="btn" id="pano-earth"><span class="icon icon-earth" aria-hidden="true"></span><span data-i18n="body.earth"></span></button>
              <button type="button" class="btn mode-btn" id="pano-full" aria-pressed="false" data-i18n="pano.full"></button>
            </div>
            <span id="pano-scale" class="pano-meta num"></span>
          </div>
          <canvas id="pano-canvas" class="pano-canvas" tabindex="0" role="img"></canvas>
          <p class="pano-foot"><span id="pano-readout" class="num" aria-live="polite"></span> <span id="pano-enlarged"></span></p>
          <p class="hint" data-i18n="pano.legend"></p>
        </section>
        <section class="timebar glass" aria-labelledby="time-heading" data-panel="time" data-panel-view="site atlas world south north" data-panel-title="time.heading">
          <h2 id="time-heading" class="visually-hidden" data-i18n="time.heading"></h2>
          <form id="time-form" class="time-form" novalidate>
            <label class="field inline">
              <span data-i18n="time.label"></span>
              <input id="time-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="time-hint">
            </label>
            <button type="submit" class="btn primary" data-i18n="time.apply"></button>
          </form>
          <div class="steps">
            <button type="button" class="btn" data-step-h="-24" data-i18n="time.minusDay"></button>
            <button type="button" class="btn" data-step-h="-1" data-i18n="time.minusHour"></button>
            <button type="button" class="btn" data-step-h="1" data-i18n="time.plusHour"></button>
            <button type="button" class="btn" data-step-h="24" data-i18n="time.plusDay"></button>
          </div>
          <div class="playback">
            <button type="button" class="btn primary" id="play-toggle" aria-pressed="false" data-i18n="time.play"></button>
            <div class="seg" role="group" data-i18n-aria="time.speed">
              <button type="button" class="btn speed-btn" data-speed="1" aria-pressed="false">×1</button>
              <button type="button" class="btn speed-btn" data-speed="60" aria-pressed="false">×60</button>
              <button type="button" class="btn speed-btn" data-speed="3600" aria-pressed="true">×3600</button>
              <button type="button" class="btn speed-btn" data-speed="86400" aria-pressed="false">×86 400</button>
            </div>
            <button type="button" class="btn" id="time-now" data-i18n="time.now"></button>
          </div>
          <p id="time-current" class="current"></p>
          <p id="time-note" class="hint" role="status" hidden></p>
          <p id="time-hint" class="visually-hidden" data-i18n="time.hint"></p>
          <p id="time-warning" class="warning" role="status" hidden></p>
        </section>
        </div>

      <!-- Vues pas encore construites : état « à venir » honnête (UI-DESIGN § 3.3). -->
      <aside class="drawer" data-view-panel="atlas world south north" hidden>
        <section class="card glass" aria-labelledby="layers-heading" data-panel="layers" data-panel-view="atlas world south north" data-panel-title="atlas.layers">
          <h2 id="layers-heading" data-i18n="atlas.layers"></h2>
          <div class="atlas-sites">
            <button type="button" class="btn" id="tour-start" data-i18n="tour.start"></button>
            <article id="site-sheet" class="sheet" aria-live="polite" hidden>
              <header class="sheet-head">
                <h3 id="sheet-name"></h3>
                <button type="button" class="btn sheet-close" id="sheet-close" data-i18n-aria="sheet.close">×</button>
              </header>
              <ul id="sheet-chips" class="chips"></ul>
              <dl id="sheet-facts" class="facts"></dl>
              <p id="tour-status" class="hint" hidden></p>
              <div class="toolbar">
                <button type="button" class="btn primary" id="sheet-open" data-i18n="sheet.open"></button>
                <button type="button" class="btn" id="tour-prev" data-i18n="tour.prev" hidden></button>
                <button type="button" class="btn" id="tour-next" data-i18n="tour.next" hidden></button>
                <button type="button" class="btn" id="tour-stop" data-i18n="tour.stop" hidden></button>
              </div>
            </article>
          </div>
          <div class="seg proj-seg" role="group" data-i18n-aria="atlas.proj.label">
            <button type="button" class="btn proj-btn" data-proj-view="atlas" aria-pressed="false" data-i18n="atlas.proj.globe"></button>
            <button type="button" class="btn proj-btn" data-proj-view="world" aria-pressed="false" data-i18n="atlas.proj.world"></button>
            <button type="button" class="btn proj-btn" data-proj-view="south" aria-pressed="false" data-i18n="atlas.proj.south"></button>
            <button type="button" class="btn proj-btn" data-proj-view="north" aria-pressed="false" data-i18n="atlas.proj.north"></button>
          </div>
          <label class="check"><input id="layer-terminator" type="checkbox" checked><span class="swatch swatch-sun" aria-hidden="true"></span><span data-i18n="atlas.terminator"></span></label>
          <label class="check"><input id="layer-earth" type="checkbox" checked><span class="swatch swatch-earth" aria-hidden="true"></span><span data-i18n="atlas.earthZone"></span></label>
          <label class="check"><input id="layer-graticule" type="checkbox"><span data-i18n="atlas.graticule"></span></label>
          <label class="check"><input id="layer-sites" type="checkbox" checked><span data-i18n="atlas.sites"></span></label>
          <div class="toolbar atlas-actions" data-atlas-only>
            <button type="button" class="btn" id="globe-home" data-i18n="atlas.home"></button>
            <button type="button" class="btn" id="globe-south" data-i18n="atlas.south"></button>
          </div>
          <dl class="facts" id="atlas-facts"></dl>
          <p id="atlas-texture-note" class="warning" role="status" hidden></p>
          <p id="atlas-kind-note" class="hint"></p>
          <p class="hint" data-i18n="atlas.note"></p>
          <p class="hint" id="atlas-credit"></p>
        </section>
      </aside>
      <section class="empty-view glass" data-view-panel="method" hidden>
        <h2 data-i18n="nav.method"></h2><p data-i18n="empty.method"></p>
        <a class="btn primary" href="#view=site" data-goto="site" data-i18n="empty.toSite"></a>
      </section>
    </main>

    <footer class="footer">
      <p id="footer-data"></p>
      <p data-i18n="footer.license"></p>
    </footer>
  </div>
</body>
</html>
